name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm --filter @sf/orchestrator build
      - run: pnpm --filter @sf/desktop build
  start-smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: orchestrator unit tests on this OS (path sandboxing, git parsing)
        run: pnpm --filter @sf/orchestrator test
      - name: pnpm start in background, then probe
        shell: bash
        env:
          SF_NO_OPEN: "1"
          SF_PORT: "47821"
        run: |
          export SF_DATA_DIR="$RUNNER_TEMP/sfdata"
          node --experimental-sqlite scripts/ci/seed-v010-db.mjs "$SF_DATA_DIR"
          pnpm start > start.log 2>&1 &
          for i in $(seq 1 90); do
            if curl -sf http://127.0.0.1:47821/ping >/dev/null; then break; fi
            sleep 2
          done
          cat start.log
          curl -sf http://127.0.0.1:47821/ | tee index.html | grep -q "window.__SF__"
          TOKEN=$(grep -o '"token":"[^"]*"' index.html | head -1 | cut -d'"' -f4)
          test -n "$TOKEN"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:47821/api/health)" = "401"
          test "$(curl -s -o /dev/null -w '%{http_code}' -H "authorization: Bearer $TOKEN" http://127.0.0.1:47821/api/health)" = "200"
          curl -sf -H "authorization: Bearer $TOKEN" http://127.0.0.1:47821/api/state | tee state.json | grep -q "Seeded v0.1 task"
          grep -q '"kind":"github"' state.json
          echo "start smoke OK (v0.1.0 database migrated)"
      - name: second pnpm start reuses the existing build
        shell: bash
        env:
          SF_NO_OPEN: "1"
          SF_PORT: "47831"
          SF_AGENT_PORT: "47832"
        run: |
          export SF_DATA_DIR="$RUNNER_TEMP/sfdata2"
          pnpm start > start2.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:47831/ping >/dev/null; then break; fi
            sleep 2
          done
          cat start2.log
          curl -sf http://127.0.0.1:47831/ | grep -q "window.__SF__"
          echo "second start OK"
  pty-smoke:
    # spawns a real shell through node-pty from the bundled sidecar layout (sf-node + resources/node_modules)
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: macos-latest, target: aarch64-apple-darwin }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @sf/orchestrator build
      - run: node apps/desktop/scripts/fetch-node.mjs ${{ matrix.target }}
      - run: node apps/desktop/scripts/pty-smoke.mjs ${{ matrix.target }}
      - name: cross-target layout for macOS x64 (prebuild fetched from the registry)
        if: runner.os == 'macOS'
        run: node apps/desktop/scripts/prepare-resources.mjs x86_64-apple-darwin "$RUNNER_TEMP/res-x64" && test -x "$RUNNER_TEMP/res-x64/node_modules/@lydell/node-pty-darwin-x64/prebuilds/darwin-x64/spawn-helper"

name: Desktop build check
on:
  pull_request:
    paths: ["apps/desktop/src-tauri/**", "apps/desktop/scripts/**", ".github/workflows/desktop-build.yml", "packages/orchestrator/**"]
jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with: { workspaces: "apps/desktop/src-tauri -> target" }
      - run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev patchelf
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @sf/orchestrator build
      - run: node apps/desktop/scripts/fetch-node.mjs x86_64-unknown-linux-gnu
      - run: pnpm --filter @sf/desktop tauri build --bundles deb
      - run: ls -la apps/desktop/src-tauri/target/release/bundle/deb

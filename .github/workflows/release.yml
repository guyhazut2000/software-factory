name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-latest, target: x86_64-apple-darwin }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "${{ matrix.target }}" }
      - uses: swatinem/rust-cache@v2
        with: { workspaces: "apps/desktop/src-tauri -> target" }
      - name: Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev patchelf
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @sf/orchestrator build
      - run: node apps/desktop/scripts/fetch-node.mjs ${{ matrix.target }}
      - name: check the node-pty prebuild for this target can be bundled
        run: node apps/desktop/scripts/prepare-resources.mjs ${{ matrix.target }}
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SF_TARGET_TRIPLE: ${{ matrix.target }} # picks the node-pty prebuild bundled by prepare-resources.mjs
        with:
          projectPath: apps/desktop
          tauriScript: pnpm tauri
          args: --target ${{ matrix.target }}
          tagName: ${{ github.ref_name }}
          releaseName: "Software Factory ${{ github.ref_name }}"
          releaseBody: "Unsigned builds. See the README quickstart for the Windows SmartScreen / macOS Gatekeeper steps."
          releaseDraft: false
          prerelease: false

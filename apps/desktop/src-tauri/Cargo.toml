[package]
name = "software-factory"
version = "0.1.0"
description = "Local software factory: AI coding agents in isolated sandboxes, driven by GitHub"
authors = ["Guy Hazut"]
edition = "2021"

[lib]
name = "software_factory_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
rand = "0.8"

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "s"
